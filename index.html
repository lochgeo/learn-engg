<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      (() => {
        try {
          const stored = localStorage.getItem('studyroom-theme')
          const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (!dark) return
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#101719')
        } catch {}
      })()
    </script>
    <meta name="description" content="A thoughtful, self-paced learning hub for Class 11, Class 12 and a professional certification." />
    <title>Studyroom - Class 11, Class 12 and Certification</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Studyroom" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- crossorigin lets the service worker store the fonts as normal responses. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
